name: Validate library
# Pull requests are checked by pull_request; push covers main after merge.
# Running push on every branch would check each PR commit twice.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install text rendering dependencies
        run: |
          # Headless UI tests load Pango/Cairo at runtime, including with CGO_ENABLED=0.
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpangocairo-1.0-0 fonts-dejavu-core fonts-noto-cjk
      - name: Check Bash scripts
        # ShellCheck is preinstalled on the GitHub-hosted Ubuntu image.
        run: shellcheck scripts/*.sh
      - name: Format, behavior, lifecycle, generated sources and cross builds
        run: bash scripts/verify.sh
