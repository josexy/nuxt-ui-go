name: Validate component website

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      NUXT_APP_BASE_URL: /nuxt-ui-go/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website check
      - run: git diff --exit-code -- internal/showcase/preview/generated.go internal/showcase/field_types_gen.go
      - run: pnpm --dir website generate
