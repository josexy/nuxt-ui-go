version: "3"

env:
  CGO_ENABLED: "0"

vars:
  # Python 3.9 or later. Windows installs it as python; python3 there can be the
  # Microsoft Store alias. Override with, for example, `task verify PYTHON=py`.
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'

tasks:
  default:
    desc: Lists available development tasks
    silent: true
    cmds:
      - task --list

  verify:
    desc: Checks formatting, tests, lifecycle, generated sources and cross builds
    summary: Runs scripts/verify.py with Python, including all examples.
    cmds:
      - "{{.PYTHON}} scripts/verify.py"

  test:native:
    desc: Runs native Gallery interaction tests in a desktop session
    summary: Opens native test windows and writes screenshots and logs to .work/native/.
    cmds:
      - "{{.PYTHON}} scripts/test-native.py"

  test:native:smoke:
    desc: Checks the first frame of a hidden native window
    summary: Requires a desktop session and checks rendering without running the interaction suite.
    cmds:
      - "{{.PYTHON}} scripts/test-native.py --hidden-smoke"

  website:dev:
    desc: Runs the bilingual component website and builds its Go previews
    cmds:
      - pnpm --dir website dev

  website:build:
    desc: Generates the static component website, API docs and WASM previews
    cmds:
      - pnpm --dir website generate

  website:check:
    desc: Checks website formatting, types and standalone Go examples
    cmds:
      - pnpm --dir website check

  fmt:website:
    desc: Formats website source with Prettier
    cmds:
      - pnpm --dir website format

  fmt:go:
    desc: Formats Go code and organizes imports with goimports
    summary: Recursively formats Go source files, adding missing imports and removing unused imports.
    aliases: [fmt]
    cmds:
      - goimports -w .

  lint:go:
    desc: Checks Go code with golangci-lint
    summary: Validates the golangci-lint v2 configuration and checks all packages, including tests.
    cmds:
      - golangci-lint config verify
      - golangci-lint run ./...

  lint:go:fix:
    desc: Applies available Go lint and formatting fixes
    summary: Validates the configuration, then writes supported linter fixes and goimports changes to source files.
    cmds:
      - golangci-lint config verify
      - golangci-lint run --fix ./...

  modernize:
    desc: Previews Go modernization changes
    summary: Prints a diff without editing files; exits nonzero when changes are suggested.
    cmds:
      - go fix -diff ./...

  modernize:fix:
    desc: Applies Go modernization fixes
    summary: Updates source files using the modernizers in the installed Go toolchain.
    cmds:
      - go fix ./...
